<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trinocular</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g fill='%23ffb000'><circle cx='16' cy='7' r='4'/><circle cx='16' cy='16' r='4'/><circle cx='16' cy='25' r='4'/></g></svg>">
<style>
:root {
  --bg: #0e0d0c; --sheet: #171514; --edge: #2a2623; --ink: #e9e3dc; --dim: #8d857d;
  --safe: #ffb000; --ok: #7fc97f; --bad: #ff6b5b; --mono: ui-monospace, "JetBrains Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--edge); padding: 12px 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.mark { font: 600 18px var(--mono); letter-spacing: .04em; display: flex; gap: 10px; align-items: center; }
.eyes { display: inline-flex; flex-direction: column; gap: 2px; }
.eyes i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
.online .eyes i { background: var(--safe); box-shadow: 0 0 6px var(--safe); }
.stat { font: 13px var(--mono); color: var(--dim); }
.stat b { color: var(--ink); font-weight: 500; }
.warn { color: var(--bad); }
.controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
select, button, label.btn { font: 13px var(--mono); background: var(--sheet); color: var(--ink);
  border: 1px solid var(--edge); border-radius: 4px; padding: 7px 11px; cursor: pointer; }
button.fire { background: var(--safe); color: #111; border-color: var(--safe); font-weight: 600; }
button:disabled { opacity: .35; cursor: not-allowed; }
label.btn input { display: none; }
.bar { height: 3px; background: var(--edge); margin-top: 10px; border-radius: 2px; overflow: hidden; display: none; }
.bar i { display: block; height: 100%; background: var(--safe); width: 0; transition: width .6s; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; gap: 18px; }
.empty { color: var(--dim); font: 14px var(--mono); padding: 48px 0; text-align: center; }
.sheet { background: var(--sheet); border: 1px solid var(--edge); border-radius: 6px; padding: 14px; }
.sheet h2 { margin: 0; font: 500 14px var(--mono); }
.chip { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px;
  border-radius: 3px; border: 1px solid currentColor; }
.chip.done { color: var(--ok); } .chip.error, .chip.interrupted { color: var(--bad); }
.chip.rotating, .chip.downloading, .chip.developing, .chip.new { color: var(--safe); }
.meta { font: 12px var(--mono); color: var(--dim); margin-left: auto; }
.frames { display: grid; grid-template-columns: repeat(3, minmax(0, 220px)); gap: 8px; margin-top: 12px; }
.frames img { width: 100%; min-width: 0; display: block; border-radius: 3px; cursor: zoom-in; background: #000; aspect-ratio: 3/4; object-fit: cover; }
.strips { display: grid; gap: 2px; margin-top: 10px; }
.strips img { width: 100%; display: block; cursor: zoom-in; aspect-ratio: auto; object-fit: fill; }
.strips-head { display: flex; gap: 8px; margin-top: 12px; font: 12px var(--mono); color: var(--dim); align-items: center; }
.strips-head button { padding: 3px 8px; font-size: 11px; }
.strips-head button.on { border-color: var(--safe); color: var(--safe); }
.msg { font: 12px var(--mono); color: var(--dim); margin-top: 8px; white-space: pre-wrap; }
.msg.error { color: var(--bad); }
.foot { display: flex; gap: 14px; margin-top: 12px; font: 12px var(--mono); }
.foot a { color: var(--dim); } .foot a:hover { color: var(--safe); }
.lb { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; z-index: 10;
  align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
.lb.open { display: flex; } .lb img { max-width: 100%; max-height: 100%; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--sheet);
  border: 1px solid var(--bad); color: var(--ink); font: 13px var(--mono); padding: 10px 14px;
  border-radius: 4px; display: none; z-index: 11; max-width: calc(100% - 32px); }
@media (max-width: 640px) { .controls { margin-left: 0; width: 100%; } .controls .fire { flex: 1; } }
</style>
</head>
<body>
<header id="hdr">
  <div class="row">
    <div class="mark"><span class="eyes"><i></i><i></i><i></i></span>trinocular</div>
    <span class="stat" id="st-link">…</span>
    <span class="stat" id="st-batt"></span>
    <span class="stat" id="st-sweep"></span>
    <span class="stat warn" id="st-block"></span>
    <div class="controls">
      <select id="mode" title="captureMode">
        <option value="2">Complete</option><option value="4">360</option>
        <option value="3">3D</option><option value="1">Simple</option>
        <option value="5">Low density</option><option value="6">Medium density</option>
        <option value="7">High density</option>
      </select>
      <button class="fire" id="fire">Fire sweep</button>
      <button id="cancel" title="cancelSweep">Stop</button>
      <label class="btn" title="Develop a sweep .bin pulled earlier">Import<input type="file" id="imp" accept=".bin"></label>
    </div>
  </div>
  <div class="bar" id="bar"><i></i></div>
</header>
<main id="feed"><div class="empty">no sweeps yet — point it at something and fire</div></main>
<div class="lb" id="lb"><img alt=""></div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const ACTIVE = new Set(["new", "rotating", "downloading", "developing"]);
let cam = {}, sweeps = [], stripKind = {};

function toast(t) { const el = $("#toast"); el.textContent = t; el.style.display = "block";
  clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 6000); }

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

function renderState() {
  $("#hdr").classList.toggle("online", !!cam.online);
  $("#st-link").innerHTML = cam.online
    ? `<b>${cam.cameraSerial || "Pro2"}</b> fw ${cam.firmwareVersion || "?"}`
    : `<span class="warn">camera offline</span>`;
  $("#st-link").title = cam.online ? cam.cameraUrl : (cam.error || "");
  $("#st-batt").innerHTML = cam.online ? `batt <b>${cam.chargePercent}%</b> ${cam.chargeStateName}` : "";
  $("#st-sweep").innerHTML = cam.online ? `sweep <b>${cam.sweepStateName}</b>` : "";
  $("#st-block").textContent = cam.online && cam.blocked?.length ? "blocked: " + cam.blocked.join(", ") : "";
  $("#fire").disabled = !cam.online || cam.busy || !!cam.blocked?.length;
  $("#cancel").disabled = !cam.online || !cam.busy;
  const live = sweeps.find(s => ACTIVE.has(s.status));
  $("#bar").style.display = live ? "block" : "none";
  if (live) $("#bar i").style.width = (live.status === "rotating" ? live.progress * 100 : 100) + "%";
}

function img(src, cls) { return `<img loading="lazy" src="${src}" data-full="${src.replace(".thumb", "")}" alt="" class="${cls || ""}">`; }

function card(s) {
  const base = `/media/${s.id}/`, d = s.develop;
  const when = new Date(s.created * 1000).toLocaleString();
  const kind = stripKind[s.id] || (s.develop?.blend?.length ? "blend" : "depth");
  let body = "";
  if (d) {
    body += `<div class="frames">${d.color.map(f => img(base + f.replace(".jpg", ".thumb.jpg"))).join("")}</div>`;
    const strips = kind === "ir" ? d.ir : kind === "blend" ? (d.blend || []) : d.depth.map(x => x.file);
    if (strips.length) {
      const cov = d.depth.map(x => Math.round(x.coverage * 100) + "%").join(" · ");
      body += `<div class="strips-head" title="Raw sensor layout — x is probably azimuth, unconfirmed until a mounted sweep (see PROTOCOL.md)">depth sensors · raw layout
        <button data-kind="depth" data-id="${s.id}" class="${kind === "depth" ? "on" : ""}">depth</button>
        <button data-kind="ir" data-id="${s.id}" class="${kind === "ir" ? "on" : ""}">IR</button>
        ${d.blend?.length ? `<button data-kind="blend" data-id="${s.id}" class="${kind === "blend" ? "on" : ""}">depth × IR</button>` : ""}
        <span>coverage ${cov}</span></div>
        <div class="strips">${strips.map(f => img(base + f)).join("")}</div>`;
    }
  }
  const bad = s.status === "error" || s.status === "interrupted";
  const msg = s.message ? `<div class="msg ${bad ? "error" : ""}">${esc(s.message)}${s.status === "rotating" ? ` — ${Math.round(s.progress * 100)}%` : ""}</div>` : "";
  const foot = ACTIVE.has(s.status) ? "" : `<div class="foot">
    ${s.bytes ? `<a href="${base}raw.bin" download="${s.id}.bin">raw.bin (${(s.bytes / 1e6).toFixed(1)} MB)</a>` : ""}
    ${d ? `<a href="${base}meta.txt" target="_blank">meta.txt</a>` : ""}
    <a href="#" data-del="${s.id}">delete</a></div>`;
  return `<section class="sheet"><div class="row">
      <h2>${s.id}</h2><span class="chip ${s.status}">${s.status}</span>
      <span class="meta">${s.modeName || s.source} · ${when}${s.camera?.chargePercent != null ? ` · ${s.camera.chargePercent}%` : ""}</span>
    </div>${msg}${body}${foot}</section>`;
}

function esc(t) { return String(t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }

function renderFeed() {
  $("#feed").innerHTML = sweeps.length ? sweeps.map(card).join("")
    : `<div class="empty">no sweeps yet — point it at something and fire</div>`;
}

let lastSig = "";
async function pollSweeps() {
  try {
    sweeps = await api("/api/sweeps");
    const sig = JSON.stringify(sweeps.map(s => [s.id, s.status, s.progress, s.message]));
    if (sig !== lastSig) { lastSig = sig; renderFeed(); }
  } catch (e) { /* keep last view */ }
  renderState();
  setTimeout(pollSweeps, sweeps.some(s => ACTIVE.has(s.status)) ? 2000 : 10000);
}
async function pollState() {
  try { cam = await api("/api/state"); } catch (e) { cam = { online: false, error: e.message }; }
  renderState();
  setTimeout(pollState, 3000);
}

$("#fire").onclick = async () => {
  $("#fire").disabled = true;
  try { await api("/api/sweeps", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ mode: +$("#mode").value }) }); lastSig = ""; pollNow(); }
  catch (e) { toast(e.message); }
};
$("#cancel").onclick = async () => { try { await api("/api/cancel", { method: "POST" }); } catch (e) { toast(e.message); } };
$("#imp").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  try { await api("/api/import", { method: "POST", body: fd }); pollNow(); } catch (err) { toast(err.message); }
  e.target.value = "";
};
function pollNow() { clearTimeout(window._pn); window._pn = setTimeout(async () => {
  sweeps = await api("/api/sweeps"); lastSig = ""; renderFeed(); renderState(); }, 300); }

$("#feed").addEventListener("click", async e => {
  const t = e.target;
  if (t.tagName === "IMG") { $("#lb img").src = t.dataset.full; $("#lb").classList.add("open"); }
  else if (t.dataset.kind) { stripKind[t.dataset.id] = t.dataset.kind; renderFeed(); }
  else if (t.dataset.del) {
    e.preventDefault();
    if (!confirm(`Delete ${t.dataset.del}? The raw sweep goes with it.`)) return;
    try { await api(`/api/sweeps/${t.dataset.del}`, { method: "DELETE" }); pollNow(); } catch (err) { toast(err.message); }
  }
});
$("#lb").onclick = () => $("#lb").classList.remove("open");
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#lb").classList.remove("open"); });

pollState(); pollSweeps();
</script>
</body>
</html>
